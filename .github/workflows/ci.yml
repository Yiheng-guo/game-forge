name: Test and build
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Start local service
        run: npm start > /tmp/forge-server.log 2>&1 &
      - run: curl --retry 10 --retry-connrefused --retry-delay 1 --fail http://127.0.0.1:4317/ > /dev/null
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-screenshots
          path: test-results/
