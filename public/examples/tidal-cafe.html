<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>潮汐小馆</title><style>*{box-sizing:border-box}body{margin:0;background:#d9f0e9;color:#163e40;font-family:system-ui,-apple-system,'Microsoft YaHei',sans-serif}button{font:inherit;cursor:pointer;border:0;border-radius:13px;min-height:46px;padding:10px 16px;font-weight:750;background:#fff6dc;color:#274c48;box-shadow:0 3px 0 #c7c8a6}button:hover{filter:brightness(1.04)}button:active{transform:translateY(2px);box-shadow:0 1px 0 #c7c8a6}button:focus-visible{outline:3px solid #ef8c4c;outline-offset:3px}button:disabled{cursor:default;opacity:.5;transform:none}.app{max-width:1080px;margin:auto;padding:14px max(12px,env(safe-area-inset-right)) 20px max(12px,env(safe-area-inset-left))}.top{display:flex;align-items:center;gap:12px;justify-content:space-between;margin-bottom:10px}.brand{font-size:24px;font-weight:900;letter-spacing:2px}.brand small{display:block;font-size:11px;letter-spacing:3px;color:#55827c}.topnav{display:flex;gap:8px}.topnav button{padding:8px 12px;font-size:13px}.stats{display:grid;grid-template-columns:1fr 1.4fr 1fr 1fr;gap:8px;margin-bottom:10px}.stat{background:#f7fff6;border:1px solid #b9d9cd;border-radius:13px;padding:9px 12px;font-size:12px;color:#55736d}.stat b{display:block;color:#224e47;font-size:19px}.bar{height:5px;border-radius:4px;background:#d6e7d8;overflow:hidden;margin-top:5px}.bar i{height:100%;display:block;background:#eb9b50;width:0;transition:width .2s}.scene{position:relative;overflow:hidden;border:5px solid #fff9e7;border-radius:23px;box-shadow:0 12px 32px #226c6025;background:#64cdd2}canvas{display:block;width:100%;height:clamp(400px,62vh,580px);touch-action:manipulation}.toast{position:absolute;left:50%;top:13px;transform:translateX(-50%);max-width:92%;white-space:nowrap;background:#fff9e8ed;padding:9px 17px;border-radius:30px;font-size:13px;font-weight:700;pointer-events:none;color:#28574c;box-shadow:0 3px 10px #17463c15}.actions{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:9px;margin-top:12px}.actions button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:14px}.actions small{font-size:11px;font-weight:500}.primary{background:#245f54;color:#fff7dc;box-shadow:0 3px 0 #103e37}.delivery{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:12px;background:#f7fff6;border:1px solid #b9d9cd;border-radius:15px;padding:12px 15px}.delivery strong{display:block;font-size:15px}.delivery p{font-size:12px;line-height:1.7;margin:4px 0 0;color:#52756c}.delivery button{flex-shrink:0;background:#f5d28a}.delivery.owned{border-color:#6cab91;background:#eaf7e6}.delivery button:disabled{opacity:1;background:#d6e9cd;color:#416b53}.hint{font-size:12px;text-align:center;line-height:1.7;margin:12px 0 0;color:#52756c}.overlay{position:fixed;inset:0;background:#123e48a6;display:flex;align-items:center;justify-content:center;padding:18px;z-index:5;backdrop-filter:blur(5px)}.overlay[hidden]{display:none}.card{width:min(480px,100%);max-height:92vh;overflow:auto;background:#fff9e8;border-radius:25px;padding:28px;box-shadow:0 22px 80px #11383e55;border:2px solid white}.eyebrow{color:#b6743c;font-size:12px;font-weight:800;letter-spacing:3px}.card h1{font-size:36px;margin:8px 0 12px;letter-spacing:3px}.card p{font-size:14px;line-height:1.9;color:#526c61}.rules{background:#e8f0db;border-radius:15px;padding:13px 17px;font-size:13px;line-height:1.9;margin:16px 0}.modalbuttons{display:flex;gap:10px;flex-wrap:wrap}.modalbuttons button{flex:1}.daylist{display:flex;gap:7px;margin:14px 0}.daylist div{flex:1;background:#f1e5c8;padding:12px 4px;text-align:center;border-radius:12px;font-size:12px}.daylist b{display:block;font-size:22px;color:#a86d35}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}@media(max-width:560px){.app{padding-top:9px}.brand{font-size:20px}.brand small{font-size:9px}.stats{gap:5px}.stat{padding:8px 7px;font-size:10px}.stat b{font-size:16px}.actions{gap:6px}.actions button{padding:9px 4px;font-size:12px}.actions small{font-size:10px}.card{padding:23px}.card h1{font-size:30px}.toast{font-size:11px;padding:8px 12px}.topnav button{font-size:12px;padding:7px 10px}.hint{font-size:11px}.delivery{padding:10px;gap:8px}.delivery strong{font-size:13px}.delivery p{font-size:11px}.delivery button{font-size:12px;padding:9px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}</style></head><body><main class="app"><header class="top"><div class="brand">潮汐小馆<small>海风 · 手冲 · 慢时光</small></div><nav class="topnav"><button id="pause">暂停</button><button id="restart">重开</button></nav></header><section class="stats" aria-label="营业状态"><div class="stat">营业日 / 剩余<b id="day">第 1 天 · 60秒</b></div><div class="stat">今日营业额 / 目标<b id="income">0 / 48</b><div class="bar"><i id="progress"></i></div></div><div class="stat">可用金币<b id="coins">20</b></div><div class="stat">累计流失 / 上限<b id="lost">0 / 6</b></div></section><div class="scene"><canvas id="game" aria-label="海岛咖啡馆。点击咖啡机制作，咖啡就绪后点击排队顾客交付。也可使用下方按钮和数字键。"></canvas><div id="toast" class="toast">海风已到，等你开店</div></div><div class="actions"><button class="primary" id="brew">制作咖啡<small>空格键 · 每杯售 12 金币</small></button><button id="machine">升级咖啡机 · 30<small>制作 3.2秒 → 2.2秒</small></button><button id="seats">增加座位 · 24<small>队列容量 4 → 6</small></button></div><section class="delivery" id="deliveryPanel" aria-label="外卖窗口升级"><div><strong id="deliveryStatus">外卖窗口 · 未购买</strong><p>购买价格：30金币 · 购后每日收益：12金币<br><span id="deliveryInfo">营业结束自动入账，不计入营业额目标。</span></p></div><button id="delivery">购买 · 30金币</button></section><p class="hint">点击顾客交付 · 数字 1–8 对应队列位置 · 空格制作 · P 暂停 · R 重开<br>先照顾耐心较少的顾客；点击上方桌椅也能增加座位。每日收入不受升级花费影响。</p><div id="announce" class="sr" aria-live="polite"></div></main><div id="overlay" class="overlay"><section class="card" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div id="eyebrow" class="eyebrow">ISLAND COFFEE HOUSE</div><h1 id="modalTitle">潮汐小馆</h1><div id="modalBody"></div><div id="modalButtons" class="modalbuttons"></div></section></div><script>(()=>{'use strict';const $=id=>document.getElementById(id),canvas=$('game'),ctx=canvas.getContext('2d');const goals=[48,84,120],durations=[60,60,60],brewTimes=[3.2,2.2,1.45],machineCosts=[30,54],seatCosts=[24,42];let W=800,H=500,D=1,state='title',day=0,time=60,coins=20,income=0,total=0,lost=0,served=0,level=0,seats=0,customers=[],coffee='empty',brewLeft=0,spawnLeft=1.2,serial=0,particles=[],floaters=[],clock=0,last=0,toastTime=0,selected=0,delivery=false,deliveryTotal=0,dayBonus=0,settled=false;const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;let machineRect={},seatRect={},spots=[];const palette=['#ec9b65','#7fae91','#d78085','#739bbc','#d9b657','#ad8db7'];function resize(){const r=canvas.getBoundingClientRect();W=r.width;H=r.height;D=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(W*D);canvas.height=Math.round(H*D);layout()}function layout(){machineRect={x:W*.12,y:H*.31,w:Math.max(84,W*.2),h:H*.24};seatRect={x:W*.53,y:H*.32,w:W*.34,h:H*.23};spots=[];for(let i=0;i<8;i++)spots.push({x:W*(.17+(i%4)*.22),y:H*(i<4?.705:.865)})}window.addEventListener('resize',resize);resize();function rr(x,y,w,h,r,fill,stroke){ctx.beginPath();ctx.roundRect(x,y,w,h,r);if(fill){ctx.fillStyle=fill;ctx.fill()}if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=1.5;ctx.stroke()}}function text(t,x,y,size=14,color='#28564c',align='center'){ctx.fillStyle=color;ctx.font=`700 ${size}px system-ui`;ctx.textAlign=align;ctx.textBaseline='middle';ctx.fillText(t,x,y)}function ellipse(x,y,rx,ry,c){ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2);ctx.fillStyle=c;ctx.fill()}function notify(t){$('toast').textContent=t;toastTime=4;$('announce').textContent=t}function ui(){$('day').textContent=`第 ${day+1} 天 · ${Math.ceil(time)}秒`;$('income').textContent=`${income} / ${goals[day]}`;$('coins').textContent=coins;$('lost').textContent=`${lost} / 6`;$('progress').style.width=Math.min(100,income/goals[day]*100)+'%';$('lost').style.color=lost>=4?'#bd583c':'#224e47';$('brew').innerHTML=coffee==='brewing'?`正在制作 · ${brewLeft.toFixed(1)}秒<small>香气正在慢慢释放</small>`:coffee==='ready'?'咖啡已就绪 · 点击顾客交付<small>优先照顾耐心最少的人</small>':'制作咖啡<small>空格键 · 每杯售 12 金币</small>';$('brew').disabled=state!=='playing'||coffee!=='empty';$('machine').innerHTML=level<2?`升级咖啡机 · ${machineCosts[level]}<small>制作 ${brewTimes[level]}秒 → ${brewTimes[level+1]}秒</small>`:'咖啡机已满级<small>每杯仅需 1.45秒</small>';$('machine').disabled=state!=='playing'||level>=2||coins<machineCosts[level];$('seats').innerHTML=seats<2?`增加座位 · ${seatCosts[seats]}<small>队列容量 ${4+seats*2} → ${6+seats*2}</small>`:'座位已满级<small>8人容量 · 额外耐心 +8秒</small>';$('seats').disabled=state!=='playing'||seats>=2||coins<seatCosts[seats];$('deliveryPanel').classList.toggle('owned',delivery);$('deliveryStatus').textContent=delivery?'外卖窗口 · 已购买 · 每日 +12金币':'外卖窗口 · 未购买';$('delivery').textContent=delivery?'已购买':coins<30?'购买 · 30金币（不足）':'购买 · 30金币';$('delivery').disabled=state!=='playing'||delivery||coins<30;$('deliveryInfo').textContent=delivery?`累计收益：${deliveryTotal}金币 · ${settled?'今日已入账 '+dayBonus+'金币':'今日打烊可领12金币'}；不计入营业额目标。`:'营业结束自动入账，不计入营业额目标。';$('pause').disabled=!['playing','paused'].includes(state);$('pause').textContent=state==='paused'?'继续':'暂停'}function modal(title,body,buttons,tag='海岛营业手记'){$('eyebrow').textContent=tag;$('modalTitle').textContent=title;$('modalBody').innerHTML=body;$('modalButtons').replaceChildren();buttons.forEach(([label,fn,primary])=>{const b=document.createElement('button');b.textContent=label;if(primary)b.className='primary';b.onclick=fn;$('modalButtons').appendChild(b)});$('overlay').hidden=false;ui();$('modalButtons').firstElementChild?.focus()}function hide(){$('overlay').hidden=true;document.activeElement?.blur()}function start(){day=0;coins=20;total=0;lost=0;served=0;level=0;seats=0;serial=0;delivery=false;deliveryTotal=0;dayBonus=0;settled=false;particles=[];floaters=[];beginDay()}function beginDay(){time=durations[day];income=0;customers=[];coffee='empty';brewLeft=0;spawnLeft=.8;selected=0;dayBonus=0;settled=false;state='playing';hide();notify(['第一天：让海岛闻到咖啡香','第二天：午后客流增多，留意耐心','第三天：旺季到了，抓紧每一次出杯'][day]);ui()}function pause(){if(state==='playing'){state='paused';modal('海风小憩',`<p>第 ${day+1} 天暂停中。剩余 ${Math.ceil(time)} 秒，今日收入 ${income} / ${goals[day]} 金币。</p><p>暂停期间顾客耐心和营业时间都会停止。</p>`,[['继续营业',()=>{state='playing';hide();ui()},true],['重新开店',start]])}else if(state==='paused'){state='playing';hide();ui()}}function confirmRestart(){if(state==='title'){start();return}if(state==='confirm')return;const before=state;state='confirm';modal('重新开店？','<p>将从第一天重新开始，金币、升级、外卖窗口和营业记录都会重置。</p>',[['返回',()=>{state=before;if(before==='playing'){hide();ui()}else restoreModal(before)},true],['重新开店',start]])}function restoreModal(s){if(s==='paused'){state='playing';pause()}else if(s==='won'||s==='lost')end(s==='won');else if(s==='between')dayEnd();else title()}function title(){state='title';modal('潮汐小馆',`<p>在潮水与椰影之间，经营一家只卖现做咖啡的小馆。</p><div class="rules">① 点击咖啡机或按空格，制作一杯咖啡。<br>② 咖啡就绪后，点击顾客交付，每杯赚 12 金币。<br>③ 花金币升级机器、增加座位；座位也延长耐心。<br>④ 外卖窗口售价 30 金币，一次购买后，每天营业结束额外获得 12 金币，购买当天即可领取。该收益不计入营业额目标。<br>⑤ 每天营业 60 秒。连续三天达标即获胜；累计流失 6 位顾客则失败。</div><div class="daylist"><div>第一天<b>48</b>金币</div><div>第二天<b>84</b>金币</div><div>第三天<b>120</b>金币</div></div><p>先选耐心快耗尽的顾客。队满时新客也会流失；咖啡出杯后不变凉。提前歇业不发放当日外卖收益。</p>`,[['开门营业',start,true]],'海风 · 手冲 · 慢时光')}function settlement(){if(settled)return;settled=true;dayBonus=delivery?12:0;coins+=dayBonus;deliveryTotal+=dayBonus}function bonusLine(){return delivery?`外卖窗口：已购买 · 每日收益 12 金币<br>今日外卖入账：${dayBonus} 金币<br>累计外卖收益：${deliveryTotal} 金币`:'外卖窗口：未购买 · 售价 30 金币<br>购后每日收益：12 金币 · 今日收益：0 金币'}function dayEnd(){state='between';customers=[];coffee='empty';settlement();if(income<goals[day]){end(false,'今天的营业额没有达到目标。');return}if(day===2){end(true);return}modal('今日打烊',`<p>第 ${day+1} 天目标达成！今日营业额 <strong>${income}</strong> 金币，累计流失 <strong>${lost}</strong> 位顾客。</p><div class="rules">${bonusLine()}<br>钱包：${coins} 金币<br>咖啡机：${brewTimes[level]} 秒 / 杯<br>队列容量：${4+seats*2} 人<br>下一天目标：${goals[day+1]} 金币，客流将继续增加。</div><p>金币和升级会保留到明天。开门后可以随时升级。外卖收益独立入账，不影响营业额目标。</p>`,[['迎接第 '+(day+2)+' 天',()=>{day++;beginDay()},true],['重新开店',start]])}function end(win,reason){state=win?'won':'lost';modal(win?'三日海岛好店':'今日提前歇业',win?`<p>三天的营业目标全部达成。潮汐小馆，成了岛上新的咖啡坐标。</p><div class="rules">累计售出：${served} 杯<br>总营业额：${total} 金币<br>${bonusLine()}<br>剩余金币：${coins}<br>流失顾客：${lost} 位</div>`:`<p>${reason||(lost>=6?'累计流失达到 6 位，顾客们离开了小馆。':'今天的营业额没有达到目标。')}</p><div class="rules">第 ${day+1} 天收入：${income} / ${goals[day]}<br>累计售出：${served} 杯<br>累计流失：${lost} 位<br>${bonusLine()}<br>剩余金币：${coins}</div><p>早点升级咖啡机，提高出杯速度；增加座位能容纳更多顾客，并延长所有顾客的耐心。${settled?'外卖收益已结算，但不能抵扣营业额目标。':'提前歇业，当日外卖收益不结算。'}</p>`,[['再开一家好店',start,true]])}function buyDelivery(){if(state!=='playing'||delivery)return;if(coins<30){notify('外卖窗口需要30金币');return}coins-=30;delivery=true;notify('外卖窗口已开通！今日起每天打烊额外 +12金币');burst(W*.91,H*.22,'#ffe494');ui()}function brew(){if(state!=='playing')return;if(coffee==='ready'){notify('咖啡好了，点击一位顾客交付');return}if(coffee==='brewing')return;coffee='brewing';brewLeft=brewTimes[level];notify('正在研磨与萃取…');ui()}function burst(x,y,c){for(let i=0;i<12;i++)particles.push({x,y,vx:(Math.random()-.5)*110,vy:-30-Math.random()*90,life:.65,max:.65,c})}function floater(x,y,t,c='#fff8db'){floaters.push({x,y,t,c,life:1.3})}function serve(index){if(state!=='playing')return;const c=customers.find(c=>c.slot===index);if(!c){notify('这个位置还没有顾客');return}selected=index;if(coffee!=='ready'){notify(coffee==='brewing'?'再等一会儿，咖啡还在制作':'先点击咖啡机，制作一杯咖啡');return}coffee='empty';customers=customers.filter(v=>v!==c);coins+=12;income+=12;total+=12;served++;const p=spots[index];burst(p.x,p.y-15,'#ffe494');floater(p.x,p.y-25,'+12');notify(income>=goals[day]?'今日目标已达成，继续营业赚取升级金币':'交付成功！继续为下一位制作');ui()}function upgrade(type){if(state!=='playing')return;if(type==='machine'){if(level>=2){notify('咖啡机已经满级');return}if(coins<machineCosts[level]){notify('金币不足，再卖几杯咖啡吧');return}coins-=machineCosts[level];level++;notify('咖啡机升级！下一杯制作更快');burst(machineRect.x+machineRect.w/2,machineRect.y,'#fff0a6')}else{if(seats>=2){notify('座位已经全部开放');return}if(coins<seatCosts[seats]){notify('金币不足，再卖几杯咖啡吧');return}coins-=seatCosts[seats];seats++;customers.forEach(c=>{c.max+=4;c.pat+=4});notify('新座位开放！队列 +2，所有顾客耐心 +4秒');burst(seatRect.x+seatRect.w/2,seatRect.y,'#fff0a6')}ui()}function loseCustomer(c,full=false){lost++;if(c){const p=spots[c.slot];floater(p.x,p.y-25,'离开了','#b4423e');customers=customers.filter(v=>v!==c)}notify(full?'队列已满，一位新客离开了':'顾客等得太久，失望地离开了');ui();if(lost>=6)end(false)}function spawn(){if(customers.length>=4+seats*2){loseCustomer(null,true);return}let slot=0;while(customers.some(c=>c.slot===slot))slot++;const max=24-day*2+seats*4+(serial%3)*2;customers.push({id:++serial,slot,max,pat:max,color:palette[serial%palette.length],hair:serial%3,phase:Math.random()*6});ui()}function update(dt){clock+=dt;if(state!=='playing')return;const step=Math.min(dt,time);time=Math.max(0,time-step);if(coffee==='brewing'){brewLeft=Math.max(0,brewLeft-step);if(brewLeft<=0){coffee='ready';notify('出杯！点击顾客交付');burst(machineRect.x+machineRect.w*.75,machineRect.y+machineRect.h*.65,'#fff4cb')}}for(const c of [...customers]){c.pat-=step;if(c.pat<=0){loseCustomer(c);if(state!=='playing')return}}if(time<=0){dayEnd();return}spawnLeft-=step;if(spawnLeft<=0){spawn();spawnLeft=[6.3,4.7,3.65][day]+Math.random()*.65}toastTime-=step;if(toastTime<=0){$('toast').textContent=coffee==='ready'?'咖啡就绪 · 点击顾客交付':coffee==='brewing'?'正在制作 · 留意顾客耐心':income>=goals[day]?'目标达成 · 营业结束后进入下一天':'点击咖啡机制作，点击顾客交付'}for(const p of particles){p.life-=step;p.x+=p.vx*step;p.y+=p.vy*step;p.vy+=180*step}particles=particles.filter(p=>p.life>0);for(const f of floaters){f.life-=step;f.y-=step*24}floaters=floaters.filter(f=>f.life>0);ui()}function cup(x,y,s=1){ctx.save();ctx.translate(x,y);ctx.scale(s,s);ellipse(2,16,21,5,'#244c4525
