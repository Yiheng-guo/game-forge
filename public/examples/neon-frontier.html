<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>霓虹边界</title><style>*{box-sizing:border-box}body{margin:0;background:#080b18;color:#e8ebff;font-family:Inter,'PingFang SC',sans-serif;overflow:hidden}canvas{width:100vw;height:100vh;object-fit:contain;display:block;touch-action:none}button{font:inherit;cursor:pointer;color:inherit}#hud{position:absolute;top:18px;left:22px;right:22px;display:flex;justify-content:space-between;align-items:flex-start;font-size:12px;pointer-events:none}#hud b{display:block;font-size:22px;letter-spacing:3px;color:#b6a0ff}#hud small{font-size:8px;letter-spacing:2px;color:#667394}#stats{display:flex;gap:20px;text-align:right;line-height:1.9;color:#9faac6}#stats strong{color:#e5d5ff}#pause{position:absolute;right:20px;bottom:19px;background:#141b32;border:1px solid #4d527744;padding:9px 14px;border-radius:7px;font-size:10px}#dash{position:absolute;left:20px;bottom:19px;background:#7666c82a;border:1px solid #a592ff55;padding:11px 20px;border-radius:8px;color:#c7b8ff;font-size:11px}.screen{position:absolute;inset:0;background:linear-gradient(90deg,#080b18ef,#080b1888);display:flex;align-items:center;justify-content:center;padding:30px;overflow:auto}.card{max-width:620px;width:100%}.eyebrow{font-size:9px;letter-spacing:4px;color:#9b84d4}.card h1{font-size:clamp(33px,6vw,62px);font-weight:600;letter-spacing:5px;margin:18px 0 6px}.card h1 em{color:#a991ff;font-style:normal}.english{letter-spacing:9px;font-size:10px;color:#6f6c94;margin-bottom:25px}.card>p{font-size:12px;color:#9a9ebc;line-height:2;max-width:440px}.features{display:flex;gap:12px;margin:28px 0}.features>div{border:1px solid #b29cff16;background:#b29cff06;padding:15px;border-radius:8px;flex:1}.features strong{font-size:11px;color:#c4b0fa;display:block;margin-bottom:7px}.features span{font-size:9px;color:#727798}.primary{background:#b9a1ff;border:1px solid #cbbaff;border-radius:7px;color:#1b1539;padding:13px 32px;font-size:12px;font-weight:600}.sub{font-size:9px;color:#606682;margin-left:15px}.upgrades{display:flex;gap:12px;margin:22px 0}.upgrades button{flex:1;border:1px solid #7b68ba44;border-radius:10px;background:#1a1831;padding:23px 13px;text-align:left}.upgrades button:hover{background:#31234b}.upgrades b{display:block;color:#cdbaff;font-size:14px;margin-bottom:10px}.upgrades span{font-size:10px;line-height:1.8;color:#9494b2}#xp{position:absolute;bottom:0;left:0;height:3px;background:#b29afa;box-shadow:0 0 10px #a894ff;transition:width .2s}[hidden]{display:none!important}@media(max-width:600px){.screen{padding:22px}.features{gap:7px}.features>div{padding:11px}.card h1{font-size:37px}.card>p{font-size:11px}.sub{display:block;margin:15px 0}.upgrades{flex-direction:column}.upgrades button{padding:13px}.upgrades b{margin-bottom:5px}.english{letter-spacing:5px}#hud{left:15px;right:15px;top:14px}#hud b{font-size:16px}#stats{gap:10px;font-size:10px}#hud small{font-size:6px}}</style></head><body><canvas id="c" width="960" height="600" aria-label="霓虹边界游戏场景"></canvas><div id="hud"><div><b>霓虹边界</b><small>NEON FRONTIER / SURVIVAL PROTOCOL</small></div><div id="stats"></div></div><button id="dash">跃迁 · Space</button><button id="pause">暂停 · P</button><div id="xp"></div><div class="screen" id="overlay"><div class="card" id="card"></div></div><script>
(()=>{const canvas=document.getElementById('c'),g=canvas.getContext('2d'),$=id=>document.getElementById(id);let mode='menu',time=0,kills=0,xp=0,nextXP=8,level=1,health=5,maxHealth=5,p={x:480,y:300},enemies=[],bullets=[],enemyShots=[],orbs=[],sparks=[],fire=0,spawn=0,dashCD=0,invul=0,damage=1,fireRate=.3,speed=160,last=0,moveTarget=null,pausedFrom='playing';const keys={};const stars=Array.from({length:110},(_,i)=>({x:(i*137.5)%960,y:(i*83.1)%600,r:i%3===0?1.3:.6}));
function menu(){mode='menu';$('overlay').hidden=false;$('card').innerHTML='<div class="eyebrow">SURVIVAL PROTOCOL / 01</div><h1>守住，<em>最后的边界。</em></h1><div class="english">NEON FRONTIER</div><p>独自穿过不断收紧的霓虹星域。自动开火，拾取能量，选择你的升级路线。坚持 75 秒，等到撤离信号。</p><div class="features"><div><strong>移动与闪避</strong><span>WASD / 方向键<br>触屏拖动目的地</span></div><div><strong>自动锁敌</strong><span>专注走位<br>击败敌人收集能量</span></div><div><strong>组合升级</strong><span>快速射击 · 超载弹头<br>护盾补给 · 移速提升</span></div></div><button class="primary" id="begin">进入星域 →</button><span class="sub">Space 跃迁 · P 暂停 · 75 秒撤离</span>';$('begin').onclick=start;}
function start(){time=0;kills=0;xp=0;nextXP=8;level=1;health=maxHealth=5;p={x:480,y:300};enemies=[];bullets=[];enemyShots=[];orbs=[];sparks=[];fire=spawn=0;dashCD=0;invul=1;damage=1;fireRate=.3;speed=160;moveTarget=null;for(const k of Object.keys(keys))delete keys[k];mode='playing';$('overlay').hidden=true;$('pause').textContent='暂停 · P';}
function burst(x,y,color,n=10){for(let i=0;i<n;i++){const a=i*Math.PI*2/n;sparks.push({x,y,vx:Math.cos(a)*(40+Math.random()*70),vy:Math.sin(a)*(40+Math.random()*70),life:.45,color});}}
function end(win){mode=win?'won':'lost';$('overlay').hidden=false;$('card').innerHTML='<div class="eyebrow">'+(win?'EXTRACTION COMPLETE':'SIGNAL LOST')+'</div><h1>'+(win?'成功穿越<em>边界。</em>':'每次失联，<em>都是起点。</em>')+'</h1><p>存活 '+Math.floor(time)+' 秒 · 击败 '+kills+' 个敌人 · '+level+' 级战机<br>'+(win?'撤离信号已接通。换一条升级路线，再挑战一次。':'观察敌人的来向，留出跃迁距离。升级护盾有时比火力更重要。')+'</p><button class="primary" id="again">重新进入星域 →</button>';$('again').onclick=start;}
function upgrade(){mode='upgrade';$('overlay').hidden=false;const opts=[['疾速射击','射击间隔缩短 20%',()=>fireRate=Math.max(.09,fireRate*.8)],['超载弹头','子弹伤害 +1',()=>damage++],['护盾补给','最大护盾 +1，恢复 2 格',()=>{maxHealth++;health=Math.min(maxHealth,health+2);}]];$('card').innerHTML='<div class="eyebrow">UPGRADE AVAILABLE / LV.'+level+'</div><h1>选择你的<em>下一次进化。</em></h1><p>时间已暂停，选择升级后继续。不同组合会改变你的生存方式。</p><div class="upgrades">'+opts.map((o,i)=>'<button data-up="'+i+'"><b>'+o[0]+'</b><span>'+o[1]+'</span></button>').join('')+'</div>';document.querySelectorAll('[data-up]').forEach(b=>b.onclick=()=>{opts[Number(b.dataset.up)][2]();mode='playing';$('overlay').hidden=true;});}
function dash(){if(mode!=='playing'||dashCD>0)return;let dx=(keys.d||keys.ArrowRight?1:0)-(keys.a||keys.ArrowLeft?1:0),dy=(keys.s||keys.ArrowDown?1:0)-(keys.w||keys.ArrowUp?1:0);if(moveTarget){dx=moveTarget.x-p.x;dy=moveTarget.y-p.y;}const len=Math.hypot(dx,dy)||1;if(!dx&&!dy)dx=1;p.x=Math.max(22,Math.min(938,p.x+dx/len*120));p.y=Math.max(22,Math.min(578,p.y+dy/len*120));dashCD=3;invul=.6;burst(p.x,p.y,'#b19aff',16);}
function pause(){if(mode==='playing'){pausedFrom=mode;mode='paused';$('pause').textContent='继续 · P';}else if(mode==='paused'){mode=pausedFrom;$('pause').textContent='暂停 · P';}}
function update(dt){time+=dt;if(time>=75){end(true);return;}dashCD=Math.max(0,dashCD-dt);invul=Math.max(0,invul-dt);let dx=(keys.d||keys.ArrowRight?1:0)-(keys.a||keys.ArrowLeft?1:0),dy=(keys.s||keys.ArrowDown?1:0)-(keys.w||keys.ArrowUp?1:0);if(moveTarget){const d=Math.hypot(moveTarget.x-p.x,moveTarget.y-p.y);if(d>7){dx=(moveTarget.x-p.x)/d;dy=(moveTarget.y-p.y)/d;}else moveTarget=null;}const len=Math.hypot(dx,dy);if(len){p.x=Math.max(18,Math.min(942,p.x+dx/len*speed*dt));p.y=Math.max(18,Math.min(582,p.y+dy/len*speed*dt));}spawn-=dt;if(spawn<=0){const side=Math.floor(Math.random()*4),tier=time>25&&Math.random()<.3?2:1;enemies.push({x:side===0?-20:side===1?980:Math.random()*960,y:side===2?-20:side===3?620:Math.random()*600,hp:tier+(time>50?1:0),tier,shot:2});spawn=Math.max(.25,.9-time*.007);}
fire-=dt;if(fire<=0&&enemies.length){const target=enemies.reduce((a,b)=>Math.hypot(a.x-p.x,a.y-p.y)<Math.hypot(b.x-p.x,b.y-p.y)?a:b),d=Math.hypot(target.x-p.x,target.y-p.y)||1;bullets.push({x:p.x,y:p.y,vx:(target.x-p.x)/d*420,vy:(target.y-p.y)/d*420,life:2});fire=fireRate;}
for(const e of enemies){let dx=p.x-e.x,dy=p.y-e.y,d=Math.hypot(dx,dy)||1;const vel=e.tier===2?38:49+time*.5;e.x+=dx/d*vel*dt;e.y+=dy/d*vel*dt;e.shot-=dt;if(e.tier===2&&e.shot<0){enemyShots.push({x:e.x,y:e.y,vx:dx/d*120,vy:dy/d*120,life:7});e.shot=3;}if(d<22&&invul<=0){health--;invul=.9;burst(p.x,p.y,'#ff879b');e.hp=0;if(health<=0){end(false);return;}}}
for(const b of bullets){b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;for(const e of enemies){if(e.hp>0&&b.life>0&&Math.hypot(b.x-e.x,b.y-e.y)<17){e.hp-=damage;b.life=0;if(e.hp<=0){kills++;orbs.push({x:e.x,y:e.y});burst(e.x,e.y,e.tier===2?'#ef92d4':'#a88afa',8);}}}}
for(const b of enemyShots){b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;if(invul<=0&&Math.hypot(b.x-p.x,b.y-p.y)<14){health--;invul=.8;b.life=0;burst(p.x,p.y,'#ff879b');if(health<=0){end(false);return;}}}
for(const o of orbs){const d=Math.hypot(o.x-p.x,o.y-p.y)||1;if(d<90){o.x+=(p.x-o.x)/d*210*dt;o.y+=(p.y-o.y)/d*210*dt;}if(d<17){o.collected=true;xp++;if(xp>=nextXP){xp-=nextXP;nextXP+=5;level++;upgrade();}}}
enemies=enemies.filter(e=>e.hp>0);bullets=bullets.filter(b=>b.life>0);enemyShots=enemyShots.filter(b=>b.life>0);orbs=orbs.filter(o=>!o.collected);for(const s of sparks){s.x+=s.vx*dt;s.y+=s.vy*dt;s.life-=dt;}sparks=sparks.filter(s=>s.life>0);}
function draw(){g.fillStyle='#080c1b';g.fillRect(0,0,960,600);const bg=g.createRadialGradient(480,280,30,480,280,540);bg.addColorStop(0,'#242048');bg.addColorStop(1,'#080c1b');g.fillStyle=bg;g.fillRect(0,0,960,600);g.strokeStyle='#8b71c30d';g.lineWidth=1;for(let x=0;x<960;x+=48){g.beginPath();g.moveTo(x,0);g.lineTo(x,600);g.stroke();}for(let y=0;y<600;y+=48){g.beginPath();g.moveTo(0,y);g.lineTo(960,y);g.stroke();}for(const s of stars){g.fillStyle='#9292bd55';g.beginPath();g.arc(s.x,s.y,s.r,0,Math.PI*2);g.fill();}g.strokeStyle='#b29aff1b';g.strokeRect(13,13,934,574);for(const o of orbs){g.fillStyle='#8be2d1';g.beginPath();g.arc(o.x,o.y,3,0,Math.PI*2);g.fill();}for(const b of bullets){g.strokeStyle='#eddaa9';g.lineWidth=3;g.beginPath();g.moveTo(b.x,b.y);g.lineTo(b.x-b.vx*.025,b.y-b.vy*.025);g.stroke();}for(const b of enemyShots){g.fillStyle='#ff879b';g.beginPath();g.arc(b.x,b.y,4,0,7);g.fill();}for(const e of enemies){g.save();g.translate(e.x,e.y);g.rotate(time*.5);g.fillStyle=e.tier===2?'#cc7da625':'#9e76e525';g.strokeStyle=e.tier===2?'#ec93bf':'#b49ae8';g.lineWidth=2;g.beginPath();g.moveTo(0,-13);g.lineTo(13,0);g.lineTo(0,13);g.lineTo(-13,0);g.closePath();g.fill();g.stroke();g.fillStyle='#f2cef8';g.fillRect(-2,-2,4,4);g.restore();}for(const s of sparks){g.globalAlpha=Math.max(0,s.life/.45);g.fillStyle=s.color;g.fillRect(s.x,s.y,3,3);}g.globalAlpha=1;g.save();g.translate(p.x,p.y);g.globalAlpha=invul>0?.5+Math.sin(time*30)*.25:1;g.shadowColor='#bea6ff';g.shadowBlur=18;g.fillStyle='#d1baff';g.beginPath();g.moveTo(0,-16);g.lineTo(12,12);g.lineTo(0,7);g.lineTo(-12,12);g.closePath();g.fill();g.shadowBlur=0;g.fillStyle='#544481';g.fillRect(-3,-3,6,11);g.restore();if(mode==='paused'){g.fillStyle='#060916bb';g.fillRect(0,0,960,600);g.textAlign='center';g.fillStyle='#c6b2ef';g.font='28px sans-serif';g.fillText('航行已暂停',480,285);g.font='13px sans-serif';g.fillStyle='#777598';g.fillText('按 P 或点击右下角继续',480,320);}g.textAlign='left';$('stats').innerHTML='<div>护盾<br><strong>'+('◆'.repeat(Math.max(0,health)))+'</strong></div><div>击败<br><strong>'+kills+'</strong></div><div>撤离倒计时<br><strong>'+Math.max(0,75-Math.floor(time))+'s</strong></div>';$('xp').style.width=xp/nextXP*100+'%';$('dash').textContent=dashCD>0?'跃迁冷却 '+dashCD.toFixed(1)+'s':'跃迁 · Space';}
function frame(t){const dt=Math.min(.04,(t-last)/1000||.016);last=t;if(mode==='playing')update(dt);draw();requestAnimationFrame(frame);}window.addEventListener('keydown',e=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();keys[e.key]=true;if(e.key.toLowerCase()==='p'&&!e.repeat)pause();if(e.key===' '&&!e.repeat)dash();});window.addEventListener('keyup',e=>keys[e.key]=false);window.addEventListener('blur',()=>{for(const k of Object.keys(keys))keys[k]=false;if(mode==='playing')pause();});document.addEventListener('visibilitychange',()=>{if(document.hidden&&mode==='playing')pause();});function point(e){const rect=canvas.getBoundingClientRect(),scale=Math.min(rect.width/960,rect.height/600),ox=(rect.width-960*scale)/2,oy=(rect.height-600*scale)/2;return {x:Math.max(16,Math.min(944,(e.clientX-rect.left-ox)/scale)),y:Math.max(16,Math.min(584,(e.clientY-rect.top-oy)/scale))};}canvas.addEventListener('pointerdown',e=>{if(mode==='playing'){moveTarget=point(e);canvas.setPointerCapture(e.pointerId);}});canvas.addEventListener('pointermove',e=>{if(e.buttons&&mode==='playing')moveTarget=point(e);});$('dash').onclick=dash;$('pause').onclick=pause;menu();requestAnimationFrame(frame);})();
</script></body></html>
